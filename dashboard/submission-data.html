<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your data — TPW</title>
<style>
  @font-face { font-family:'Rubik One'; src:url('../assets/fonts/rubik-one.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:'Degular'; src:url('../assets/fonts/degular-text-500.woff2') format('woff2'); font-weight:400 500; font-display:swap; }
  @font-face { font-family:'Degular'; src:url('../assets/fonts/degular-text-700.woff2') format('woff2'); font-weight:700 800; font-display:swap; }

  :root {
    --green: #7cc089;
    --sage: #5d8d67;
    --yellow: #edca72;
    --ink: #000;
    --paper: #fff;
    --body: #3e3e3e;
    --display: 'Rubik One', 'Arial Black', sans-serif;
    --text: 'Degular', ui-sans-serif, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--text); font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  .shell { max-width: 1440px; margin: 0 auto; padding: 0 40px; }

  /* prototype notice, kept to one thin line */
  .demo-banner { background: var(--ink); color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; text-align: center; }
  .demo-banner b { background: var(--yellow); color: #000; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 10px; padding: 3px 8px; border-radius: 999px; }
  .demo-banner span { opacity: .8; }

  /* header — their nav */
  .site-header { display: flex; align-items: center; justify-content: space-between; gap: 32px; padding: 26px 40px; max-width: 1440px; margin: 0 auto; }
  .site-header .logo img { width: 190px; }
  .site-header nav { display: flex; align-items: center; gap: 38px; font-size: 17px; }
  .site-header nav a { text-decoration: none; }
  .site-header nav a:hover { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; }
  .site-header nav a.login { font-weight: 700; }
  .site-header nav a.login:hover { color: var(--sage); }
  /* Form Demo is the cta: the one thing on this nav that we built. */
  .site-header nav a.cta {
    background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px;
    font-weight: 700; font-size: 15px;
  }
  .site-header nav a.cta:hover { background: var(--sage); text-decoration: none; }

  /* hero */
  .hero { position: relative; }
  .hero img { width: 100%; height: clamp(420px, 62vh, 720px); object-fit: cover; object-position: center 42%; }
  .hero .overlay { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: clamp(24px, 4vw, 64px);
    background: linear-gradient(to top, rgba(0,0,0,.42) 0%, rgba(0,0,0,0) 55%); }
  .hero h1 { font-family: var(--display); font-weight: 400; color: #fff; font-size: clamp(1.9rem, 4.3vw, 3.9rem);
    line-height: 1.02; margin: 0; max-width: 22ch; letter-spacing: -.01em; }

  .band { background: var(--green); padding: clamp(20px, 3vw, 34px) 24px; text-align: center; }
  .band h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.5rem, 3.5vw, 3.3rem); line-height: 1; margin: 0; text-transform: uppercase; }
  .band p { margin: 14px auto 0; max-width: 52ch; font-size: clamp(1rem, 1.5vw, 1.2rem); text-wrap: balance; }

  /* three cards */
  .cards-wrap { padding: clamp(32px, 5vw, 72px) 0 0; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card { padding: clamp(28px, 3vw, 44px); }
  .card h3 { font-family: var(--display); font-weight: 400; font-size: clamp(1.25rem, 1.9vw, 1.6rem); margin: 0 0 22px; }
  .card ul { margin: 0; padding-left: 20px; display: grid; gap: 14px; font-size: 17px; }
  .card.sage { background: var(--sage); color: #fff; border-radius: 14px 14px 0 0; }
  .card.yellow { background: var(--yellow); color: #000; border-radius: 14px 14px 0 0; }
  .card.black { background: var(--ink); color: #fff; }
  .card.black ul { list-style: none; padding-left: 0; }

  /* torn green panel */
  .torn { background: var(--green); color: #000; margin-top: -14px; padding: clamp(64px, 8vw, 110px) 0 clamp(56px, 7vw, 96px);
    clip-path: polygon(0 16px, 6% 9px, 13% 15px, 21% 6px, 29% 13px, 37% 7px, 45% 14px, 53% 7px, 61% 13px, 69% 6px, 77% 14px, 85% 8px, 92% 15px, 100% 9px, 100% 100%, 0 100%); }
  .torn-inner { display: grid; grid-template-columns: 1fr 1px 1.15fr; gap: clamp(24px, 4vw, 56px); align-items: center; }
  .torn-inner .divider { background: #000; width: 1px; height: 100%; min-height: 260px; opacity: .85; }
  .pill { display: inline-block; background: var(--yellow); color: #000; font-family: var(--display); font-weight: 400;
    font-size: clamp(1.05rem, 1.7vw, 1.45rem); padding: 12px 24px; border-radius: 8px; margin-bottom: 26px; }
  .torn .sub { font-weight: 700; font-size: clamp(1.1rem, 1.7vw, 1.5rem); margin: 0 0 20px; line-height: 1.25; }
  .stat-inline { display: flex; align-items: flex-start; gap: 18px; }
  .stat-inline .n { font-family: var(--display); font-weight: 400; font-size: clamp(3rem, 6vw, 5rem); line-height: .8; color: #fff; }
  .stat-inline .d { font-size: clamp(1rem, 1.4vw, 1.25rem); max-width: 26ch; line-height: 1.35; }
  blockquote { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 3vw, 2.6rem); line-height: 1.12; letter-spacing: -.01em; }

  /* triple impact */
  .impact { padding: clamp(56px, 7vw, 96px) 0; }
  .impact .eyebrow { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(1.4rem, 2.8vw, 2.2rem); margin: 0 0 34px; }
  .impact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .impact-cell { border-top: 3px solid var(--ink); padding-top: 18px; }
  .impact-cell .label { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; color: #797979; margin-bottom: 12px; }
  .impact-cell .num { font-family: var(--display); font-size: clamp(2.2rem, 4.2vw, 3.4rem); line-height: .95; margin-bottom: 12px; }
  .impact-cell .num.hl { color: var(--sage); }
  .impact-cell p { margin: 0; font-size: 16px; color: var(--body); }

  /* 1% campaign */
  .campaign { background: #f6f6f6; padding: clamp(56px, 7vw, 88px) 0 clamp(40px, 5vw, 60px); }
  .campaign h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(1.5rem, 3.2vw, 2.6rem); margin: 0 0 30px; }
  .campaign ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
  .campaign li { display: flex; gap: 14px; font-size: 17px; }
  .campaign li::before { content: ""; flex: 0 0 auto; width: 10px; height: 10px; margin-top: 9px; border-radius: 50%; background: var(--sage); }
  .campaign .after { margin: 34px 0 0; font-size: clamp(1.05rem, 1.7vw, 1.4rem); font-weight: 700; }

  /* member gallery */
  .gallery { padding: clamp(44px, 5vw, 64px) 0; }
  .gallery h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(1.2rem, 2.2vw, 1.8rem); margin: 0 0 24px; }
  .thumbs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .thumbs a { display: block; overflow: hidden; border-radius: 6px; }
  .thumbs img { aspect-ratio: 1; object-fit: cover; transition: transform .3s ease; }
  .thumbs a:hover img { transform: scale(1.04); }

  .closing { background: var(--ink); color: #fff; padding: clamp(56px, 7vw, 104px) 0; }
  .closing h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 3vw, 2.5rem); line-height: 1.1; margin: 0 0 22px; max-width: 24ch; }
  .closing p { margin: 0; max-width: 68ch; color: #cfcfcf; font-size: 16.5px; }

  /* ---- additive: member intake ---- */
  .member { background: var(--green); padding: clamp(44px, 5vw, 72px) 0; }
  .member .row { display: flex; align-items: center; justify-content: space-between; gap: 28px; flex-wrap: wrap; }
  .member .tag { display: inline-block; background: #000; color: #fff; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .12em; padding: 4px 10px; border-radius: 999px; margin-bottom: 14px; }
  .member h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.2rem, 2.4vw, 1.8rem); margin: 0 0 8px; }
  .member p { margin: 0; font-size: 16px; max-width: 60ch; }
  .member .btn { flex: 0 0 auto; background: #000; color: #fff; text-decoration: none; font-weight: 700; font-size: 15px;
    padding: 14px 26px; border-radius: 999px; }
  .member .btn:hover { background: #191919; }

  footer { padding: 34px 0 96px; font-size: 13px; color: #797979; }
  footer a { color: #797979; }

  /* ---- dev bar (bottom, hideable, no JS) ---- */
  .devbar { position: fixed; left: 14px; bottom: 14px; z-index: 90; font-family: var(--text); font-size: 13px; }
  .devbar summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 7px;
    background: rgba(16,16,16,.92); color: #fff; padding: 7px 13px; border-radius: 999px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
  .devbar summary::-webkit-details-marker { display: none; }
  .devbar summary::before { content: "▴"; font-size: 9px; }
  .devbar[open] summary::before { content: "▾"; }
  .devbar .panel { margin-top: 8px; background: #fff; border: 1px solid #e6e3dd; border-radius: 10px;
    padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.14); max-width: 320px; }
  .devbar .panel .h { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: #9a958e; font-weight: 700; margin-bottom: 8px; }
  .devbar .panel a { display: block; padding: 4px 0; color: #3e3e3e; text-decoration: none; }
  .devbar .panel a:hover { color: var(--sage); text-decoration: underline; text-underline-offset: 3px; }
  .devbar .panel .sep { border-top: 1px solid #eeece7; margin: 8px 0; }

  @media (max-width: 900px) {
    .shell, .site-header { padding-left: 22px; padding-right: 22px; }
    .site-header { flex-wrap: wrap; gap: 16px; padding-top: 18px; padding-bottom: 18px; }
    .site-header nav { width: 100%; flex-wrap: wrap; gap: 12px 20px; font-size: 15px; }
    .site-header .logo img { width: 128px; }
    .hero h1 { font-size: clamp(1.5rem, 7.2vw, 2.3rem); max-width: none; }
    .hero img { height: 62vh; min-height: 360px; }
    .band h2 { font-size: clamp(1.3rem, 6.4vw, 2rem); }
    .band p { font-size: 15px; }
    .demo-banner { font-size: 12px; padding: 8px 14px; }
    .cards, .impact-grid, .campaign ul { grid-template-columns: 1fr; }
    .card.yellow, .card.sage { border-radius: 14px; }
    .card.black { border-radius: 0; }
    .torn-inner { grid-template-columns: 1fr; }
    .torn-inner .divider { display: none; }
    .thumbs { grid-template-columns: repeat(3, 1fr); }
    footer { padding-bottom: 120px; }
  }

body { min-height: 100vh; display: flex; flex-direction: column; }
.site-header { width: 100%; }
.site-header nav { flex-wrap: wrap; gap: 16px 26px; }
.site-header nav [aria-current] { text-decoration: underline; text-underline-offset: 5px; font-weight: 700; }
main { flex: 1; }
.dashboard-heading { background: var(--green); padding: clamp(48px, 7vw, 88px) 0; }
.dashboard-heading h1 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(2.6rem, 6vw, 5rem); line-height: 1; margin: 0 0 20px; }
.dashboard-heading p { margin: 0; max-width: 55ch; font-size: 21px; }
.dashboard-content { padding-top: 56px; padding-bottom: 80px; max-width: 1240px; }
.view-heading { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
.view-heading h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 3vw, 2.2rem); margin: 0 0 8px; line-height: 1.2; }
.view-heading p { margin: 0; color: var(--body); }
.signin-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.signin-card { display: flex; flex-direction: column; padding: 30px; border: 1px solid #dce3da; border-radius: 16px; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.04); }
.card-icon { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 12px; background: #eaf3ec; margin-bottom: 30px; font-family: var(--display); font-size: 24px; }
.signin-card:nth-child(2) .card-icon { background: #fff3d3; }
.signin-card h3 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0 0 14px; }
.signin-card p { margin: 0 0 30px; color: var(--body); flex: 1; }
.signin-card.admin { background: #141813; color: #fff; border-color: #141813; }
.signin-card.admin p { color: #d3ddd0; }
.admin .card-icon { background: var(--yellow); color: #000; font-size: 16px; }
.account-label { display: inline-block; color: var(--sage); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; margin-bottom: 10px; }
.action { display: inline-flex; align-items: center; justify-content: space-between; gap: 20px; border: 0; border-radius: 999px; padding: 12px 22px; background: #000; color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
.action:hover { background: var(--sage); }
.admin .action { background: var(--green); color: #000; }
.switch { border: 1px solid #b9c8b8; background: #fff; color: #000; }
.placeholder-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; margin-top: 36px; }
.placeholder { border: 1px solid #e0e5df; border-radius: 14px; padding: 26px; background: #f7f9f5; }
.placeholder h3 { font-size: 20px; margin: 0 0 12px; }
.placeholder p { color: #666; margin: 0; font-size: 16px; }
.scope { padding: 20px 24px; background: #edf6ef; border-left: 4px solid var(--sage); border-radius: 8px; }
.scope p { margin: 5px 0 0; color: var(--body); }
footer { margin-top: auto; padding-top: 26px; padding-bottom: 26px; width: 100%; border-top: 1px solid #e5e5e5; font-size: 14px; color: #666; }
[hidden] { display: none !important; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--sage); outline-offset: 5px; }
@media(max-width: 850px) { .signin-grid, .placeholder-grid { grid-template-columns: 1fr; } .signin-card { padding: 26px; } .card-icon { margin-bottom: 20px; } }

  #signin { max-width: 660px; margin: 0 auto; }
  #signin .view-heading { text-align: center; justify-content: center; margin-bottom: 32px; }
  .signin-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  .signin-option { display: flex; align-items: center; justify-content: center; gap: 22px; min-height: 100px; padding: 20px 28px; border: 2px solid #9aa69b; border-radius: 12px; background: #fff; color: #344a39; font-size: 28px; font-weight: 700; text-decoration: none; transition: border-color .15s, box-shadow .15s, background .15s; }
  .signin-option:hover, .signin-option:focus-visible { border-color: var(--sage); background: #f7fbf7; box-shadow: 0 0 0 5px #e7ede7; }
  .option-icon { display: grid; place-items: center; width: 50px; height: 50px; flex-shrink: 0; border-radius: 12px; background: #e5f2e8; color: #355b3d; font-family: var(--display); font-size: 21px; font-weight: 400; }
  .option-icon.org-two { background: #fff1cd; color: #6e541a; }
  .option-icon.tpw-icon { background: #151b16; color: var(--green); font-size: 14px; }
  @media(max-width: 500px) { .signin-option { min-height: 88px; font-size: 24px; gap: 18px; } }

  #signin { max-width: 420px; border: 1px solid #dce2db; border-radius: 18px; padding: 28px 24px 20px; background: #fff; }
  #signin .view-heading { margin-bottom: 22px; }
  #signin .view-heading h2 { font-family: var(--text); font-size: 25px; font-weight: 700; }
  #signin .view-heading p { font-size: 16px; }
  #signin .account-label { font-size: 11px; margin-bottom: 8px; }
  .signin-grid { gap: 0; }
  .signin-option { min-height: 68px; justify-content: flex-start; gap: 14px; padding: 12px 10px; border: 0; border-bottom: 1px solid #e5e9e3; border-radius: 0; font-size: 17px; color: #26362b; }
  .signin-option:last-child { border-bottom: 0; }
  .signin-option:hover, .signin-option:focus-visible { background: #f1f6f1; box-shadow: none; border-color: #e5e9e3; }
  .option-icon { width: 36px; height: 36px; border-radius: 50%; font-size: 14px; }
  .option-icon.tpw-icon { font-size: 10px; }
  @media(max-width: 500px) { #signin { padding: 24px 18px 16px; } .signin-option { min-height: 64px; font-size: 17px; gap: 14px; } }

.program-results { margin-top: 30px; }
.program-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px; }
.program-stat { border: 1px solid #e0e6dc; border-radius: 12px; padding: 22px; display: grid; gap: 5px; }
.program-stat strong { font-family: var(--display); font-weight: 400; font-size: 32px; }
.program-stat span { color: #666; font-size: 15px; }
.program-list-heading { margin-bottom: 22px; }
.program-list-heading h3 { margin: 0 0 6px; font-size: 25px; }
.program-list-heading > span { color: #666; font-size: 16px; }
.existing-program-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.existing-program { border: 1px solid #dce4d8; border-radius: 16px;  padding: 26px; min-width: 0; overflow-wrap: anywhere; box-shadow: 0 4px 18px rgba(0,0,0,.03); }
.program-card-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.sample-tag { font-size: 11px; font-weight: 700; background: #fff3d1; color: #715319; border-radius: 999px; padding: 3px 9px; }
.program-owner { color: var(--sage); font-weight: 700; font-size: 14px; }
.existing-program > h3 { font-size: 26px; line-height: 1.15; margin: 0 0 14px; }
.program-status { display: inline-block; border-radius: 999px; padding: 4px 12px; background: #f0f2ee; font-size: 12px; font-weight: 700; }
.program-status[data-status="Completed"] { background: #e5f4e9; color: #2a6038; }
.program-status[data-status="In Progress"] { background: #fff3d1; color: #715319; }
.program-locations { display: grid; gap: 10px; margin: 22px 0; }
.program-location { background: #f6f8f3; border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; font-size: 16px; }
.program-location span { font-size: 14px; color: #666; }
.program-date-range { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-top: 18px; border-top: 1px solid #e4e8e0; margin-bottom: 22px; }
.program-date-range > div { display: grid; gap: 4px; }
.program-date-range span { color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.program-date-range strong { font-size: 16px; }
.program-card-metrics { display: grid; grid-template-columns: repeat(3, 1fr); background: #edf4e9; border-radius: 10px; padding: 16px 8px; }
.program-card-metrics > div { display: grid; text-align: center; gap: 4px; }
.program-card-metrics > div + div { border-left: 1px solid #d1dfc8; }
.program-card-metrics strong { font-size: 25px; line-height: 1.2; }
.program-card-metrics span { font-size: 12px; color: #53614d; }
@media(max-width: 750px) { .existing-program-grid { grid-template-columns: 1fr; } .program-stat { padding: 14px; } .program-stat strong { font-size: 26px; } }

.participants-chart { border: 1px solid #dce4d8; border-radius: 16px; padding: clamp(18px, 3vw, 30px); margin-bottom: 40px; background: #fff; }
.chart-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.chart-heading h3 { font-size: 24px; margin: 0; }
.chart-latest { color: var(--sage); font-size: 22px; }
.chart-caption { color: #666; font-size: 14px; margin: 10px 0 18px; max-width: 85ch; }
.participants-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-axis { fill: #63705f; font-family: var(--text); font-size: 14px; }
.participants-chart circle:focus-visible { outline: 3px solid #000; outline-offset: 4px; }
.chart-data { margin-top: 14px; font-size: 14px; }
.chart-data summary { cursor: pointer; color: var(--sage); font-weight: 700; }
.chart-data table { width: 100%; border-collapse: collapse; margin-top: 14px; text-align: left; }
.chart-data th, .chart-data td { padding: 10px 8px; border-bottom: 1px solid #e4e8e0; }
@media(max-width: 500px) { .chart-heading h3 { font-size: 20px; } .chart-latest { font-size: 18px; } .chart-axis { font-size: 18px; } }

.dashboard-overview { display: grid; grid-template-columns: minmax(170px, 1fr) minmax(0, 3fr); gap: 24px; align-items: stretch; margin-bottom: 40px; }
.dashboard-overview .program-stats { grid-template-columns: 1fr; gap: 14px; margin-bottom: 0; }
.dashboard-overview .program-stat { padding: 18px 22px; align-content: center; }
.dashboard-overview .participants-chart { margin-bottom: 0; min-width: 0; }
@media(max-width: 750px) {
  .dashboard-overview { grid-template-columns: 1fr; }
  .dashboard-overview .program-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dashboard-overview .program-stat { padding: 14px; }
}

.program-page { padding-top: 40px; padding-bottom: 70px; max-width: 1440px; }
.table-search { display: grid; gap: 8px; max-width: 440px; font-weight: 700; font-size: 15px; margin: 24px 0; }
.table-search input { font: inherit; border: 1px solid #b7c5b4; border-radius: 8px; min-height: 44px; padding: 10px 14px; }
.table-wrap { overflow-x: auto; border: 1px solid #cdd7c9; border-radius: 10px; max-height: 70vh; }
.program-table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1300px; font-size: 14px; white-space: nowrap; }
.program-table caption { text-align: left; background: #f3f6ef; padding: 12px 16px; color: #5b6656; font-size: 13px; white-space: normal; }
.program-table th, .program-table td { border-right: 1px solid #e0e6dc; border-bottom: 1px solid #e0e6dc; padding: 12px 14px; text-align: left; }
.program-table th { position: sticky; top: 0; z-index: 2; background: #e9f1e3; font-weight: 700; }
.program-table th button { border: 0; background: none; color: inherit; padding: 0; font: inherit; font-weight: 700; cursor: pointer; display: flex; gap: 12px; align-items: center; }
.program-table tbody tr:nth-child(even) td { background: #f8faf6; }
.program-table tbody tr:hover td { background: #edf5e8; }
.program-table td.row-number { color: #77816f; background: #f3f6ef; text-align: center; }
.program-table td.numeric { text-align: right; font-variant-numeric: tabular-nums; }
.program-table td.program-name { font-weight: 700; }
.program-table th:first-child, .program-table td:first-child { position: sticky; left: 0; background: #f3f6ef; }
.program-table th:first-child { z-index: 3; }
.table-empty { border: 1px dashed #cdd7c9; border-radius: 10px; padding: 32px; text-align: center; color: #666; }
.program-stat[href] { text-decoration: none; transition: background .15s, border-color .15s; }
.program-stat[href]:hover { background: #edf5e8; border-color: var(--sage); }

/* Neutral card surfaces throughout the dashboard. */
.scope { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; }
.program-stat, .existing-program, .participants-chart, #signin { border-color: #e0e0e0; background: #fff; }
.program-location, .program-card-metrics { background: #f7f7f7; }
.program-card-metrics > div + div { border-left-color: #e0e0e0; }
.placeholder { border-color: #e0e0e0; background: #fff; }

.program-toolbar { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 20px; margin: 24px 0; }
.program-toolbar .table-search { margin: 0; flex: 1; max-width: 440px; min-width: 220px; }
.view-toggle { display: inline-flex; padding: 4px; gap: 4px; border: 1px solid #ddd; border-radius: 10px; background: #f5f5f5; }
.view-toggle button { border: 0; background: transparent; color: #555; font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 7px; cursor: pointer; }
.view-toggle button[aria-pressed="true"] { background: #fff; color: #000; box-shadow: 0 1px 4px #0002; font-weight: 700; }

.submission-choices { max-width: 820px; margin: clamp(30px, 7vh, 90px) auto; text-align: center; }
.submission-choices h2 { font-family: var(--text); font-size: clamp(25px, 3vw, 34px); margin: 10px 0; line-height: 1.15; }
.submission-choices > p { color: #777; font-size: 17px; margin: 0 0 36px; }
.submission-choice-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 24px; }
.submission-choice { border: 1px solid #dce2d8; border-radius: 16px; background: #fff; padding: 32px; display: flex; flex-direction: column; align-items: flex-start; text-align: left; font: inherit; cursor: pointer; transition: transform .2s, box-shadow .2s, border-color .2s; }
.submission-choice:hover { transform: translateY(-4px); border-color: #a0b59b; box-shadow: 0 10px 26px #00000009; }
.submission-choice:focus-visible { outline: 3px solid var(--sage); outline-offset: 4px; }
.choice-icon { display: grid; place-items: center; width: 56px; height: 56px; background: #edf3e9; color: #4a6d46; border-radius: 14px; margin-bottom: 26px; }
.choice-icon svg { width: 28px; height: 28px; }
.report-icon { background: #fff2d1; color: #886922; }
.submission-choice > strong { font-size: 25px; line-height: 1.2; margin-bottom: 14px; }
.submission-choice > span:not(.choice-icon):not(.choice-next) { color: #777; font-size: 16px; }
.submission-choice .choice-next { margin-top: auto; padding-top: 30px; font-size: 15px; font-weight: 700; color: #4a6d46; }
@media(max-width:700px) { .submission-choice-grid { grid-template-columns: 1fr; } .submission-choice { padding: 26px; } }
@media(prefers-reduced-motion:reduce) { .submission-choice { transition: none; } .submission-choice:hover { transform: none; } }

.submission-filters { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; margin: 28px 0; }
.submission-filters label { display: grid; gap: 8px; font-size: 13px; font-weight: 700; flex: 1; min-width: 140px; }
.submission-filters input, .submission-filters select, .submission-filters button { font: inherit; padding: 10px 12px; border: 1px solid #d2d8ce; border-radius: 8px; min-height: 44px; background: #fff; }
.submission-filters button { cursor: pointer; font-size: 14px; }
.submission-summary { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; margin-bottom: 30px; }
.submission-summary > div { display: grid; gap: 8px; padding: 20px; background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; }
.submission-summary strong { font-family: var(--display); font-weight: 400; font-size: 28px; }
.submission-summary span { color: #777; font-size: 13px; }
.submission-list-toolbar { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
.submission-list-toolbar h3 { margin: 0; font-size: 23px; }
.submission-data-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 20px; }
.submission-data-card { padding: 24px; border: 1px solid #e0e0e0; border-radius: 14px; background: #fff; min-width: 0; overflow-wrap: anywhere; }
.submission-data-card header { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 20px; }
.submission-data-card h3 { margin: 0; font-size: 22px; }
.submission-data-card .submission-date { font-size: 14px; color: #777; }
.quarter-badge { padding: 5px 10px; border-radius: 999px; background: #f1f2ef; font-size: 12px; font-weight: 700; white-space: nowrap; }
.submission-card-metrics { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); padding: 16px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; gap: 12px; margin-bottom: 16px; }
.submission-card-metrics > div { display: grid; gap: 4px; }
.submission-card-metrics strong { font-size: 23px; }
.submission-card-metrics span { font-size: 12px; color: #777; }
.submission-data-card details { font-size: 14px; }
.submission-data-card summary { cursor: pointer; font-weight: 700; }
.submission-data-card li { padding: 8px 0; }
.submission-table { min-width: 1000px; }
.data-totals-note { font-size: 13px; color: #777; margin: -14px 0 30px; }
@media(max-width:800px) { .submission-data-grid { grid-template-columns: 1fr; } .submission-summary { grid-template-columns: repeat(2,minmax(0,1fr)); } }
</style>
