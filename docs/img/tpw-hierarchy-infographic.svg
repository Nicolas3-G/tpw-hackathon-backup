<text x="60" y="515" font-size="13" font-weight="400" fill="#52606d" text-anchor="start" >Each coloured block is one programme. The colour shows which partner organisation runs it. Illustration only: the programmes and placements are made up.</text>
<text x="60" y="560" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start" >Partner organisations</text>
<text x="60" y="582" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" >A partner runs one or more programmes, and can work in many yards at many institutions.</text>
<rect x="60" y="600" width="400" height="84" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
<rect x="60" y="600" width="12" height="84" rx="6" fill="#1f7a70" stroke="none" stroke-width="1"/>
