<text x="90" y="654" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start" >Runs: Mindfulness</text>
<text x="90" y="674" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" >Works in 4 yards across 3 institutions</text>
<rect x="500" y="600" width="400" height="84" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
