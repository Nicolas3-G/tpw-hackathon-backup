<text x="60" y="55" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start" >Where TPW partners work: how the pieces fit together</text>
<text x="60" y="85" font-size="16" font-weight="400" fill="#52606d" text-anchor="start" >Places sit inside each other. Programmes are not a place: a partner organisation runs each one, and it happens in a yard.</text>
<rect x="60" y="112" width="1280" height="72" rx="10" fill="#1d3557" stroke="none" stroke-width="1"/>
<text x="700" y="143" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" >CDCR: California Department of Corrections and Rehabilitation</text>
<text x="700" y="168" font-size="15" font-weight="400" fill="#dbe4f0" text-anchor="middle" >The state department that runs the prisons. It is an organisation, not a place.</text>
