<rect x="940" y="600" width="12" height="84" rx="6" fill="#6b4c9a" stroke="none" stroke-width="1"/>
<text x="970" y="630" font-size="19" font-weight="700" fill="#6b4c9a" text-anchor="start" >Partner C</text>
<text x="970" y="654" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start" >Runs: Dog training</text>
<text x="970" y="674" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" >Works in 2 yards across 2 institutions</text>
<text x="60" y="730" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start" >Why the data form is so much work</text>
<text x="60" y="754" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" >TPW's form wants one row per programme, per yard. Partner A's Mindfulness programme runs in 4 yards (outlined in gold above), so Partner A fills the form in 4 times.</text>
