<text x="530" y="654" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start" >Runs: Art, Victim dialogue</text>
<text x="530" y="674" font-size="15" font-weight="400" fill="#52606d" text-anchor="start" >Works in 4 yards across 3 institutions</text>
